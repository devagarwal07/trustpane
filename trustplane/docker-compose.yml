version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustplane-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TrustPlane
      - VERSION=1.0.0
      - DEBUG=true
      - ENVIRONMENT=development
      - API_V1_PREFIX=/api/v1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      - ./backend:/app
      - backend-cache:/home/trustplane/.cache
    networks:
      - trustplane-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: trustplane-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trustplane-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: trustplane-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - trustplane-network
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - production

volumes:
  backend-cache:
    driver: local
  redis-data:
    driver: local

networks:
  trustplane-network:
    driver: bridge
